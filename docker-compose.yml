version: '3.8'

services:
  backend:
    build: ./backend
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sncft_db
      POSTGRES_USER: sncft_user
      POSTGRES_PASSWORD: sncft_pass
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/var/www/symfony/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
